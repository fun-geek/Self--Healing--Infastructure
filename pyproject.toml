[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "0.1.0"
description = "SENTINEL AI - agentic self-healing infrastructure security platform (simulator-only)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pandas>=2.2,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "PyJWT>=2.9,<3",
  "prometheus-client>=0.20,<1",
  "streamlit>=1.38,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
rag = [
  "chromadb>=0.5,<2",
  "sentence-transformers>=3,<6",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: crosses multiple components with a real SQLite database",
  "e2e: full detect -> quarantine -> restore -> validate -> return workflow",
  "security: verifies a security control",
]
filterwarnings = [
  "ignore::DeprecationWarning:streamlit.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["sentinel", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "S104", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
